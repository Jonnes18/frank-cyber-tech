<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Forever Us ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Tangerine:wght@700&family=Cinzel:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Ambient star + atmosphere canvas, persists across the whole experience -->
<canvas id="sky"></canvas>
<div id="glow-orb"></div>
<div id="floaters"></div>

<!-- Background music -->
<audio id="bg-music" src="perfect.mp3" loop preload="auto"></audio>
<button id="sound-toggle" aria-label="Toggle sound" class="hidden">
  <svg id="sound-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 9v6h4l5 5V4L8 9H4z"/></svg>
</button>

<main id="stage">

  <!-- 1. WELCOME -->
  <section class="screen active" id="screen-welcome">
    <div class="eyebrow">a letter written for you</div>
    <h1 class="script-heading">Happy Girlfriend&rsquo;s Day</h1>
    <h2 class="name-heading">Mrs. Icone</h2>
    <p class="lede">Someone made something special just for you.</p>
    <button class="glow-btn" id="btn-open-heart">
      <span>Open My Heart</span> <span class="heart-icon">❤️</span>
    </button>
  </section>

  <!-- 2. COUNTDOWN -->
  <section class="screen" id="screen-countdown">
    <div class="countdown-label">preparing something beautiful</div>
    <div class="countdown-number" id="countdown-number">10</div>
    <div class="countdown-ring"></div>
  </section>

  <!-- 3. ENVELOPE -->
  <section class="screen" id="screen-envelope">
    <div class="envelope-wrap" id="envelope-wrap">
      <div class="envelope" id="envelope">
        <div class="envelope-back"></div>
        <div class="letter-peek"></div>
        <div class="envelope-flap"></div>
        <div class="envelope-front-left"></div>
        <div class="envelope-front-right"></div>
        <button class="wax-seal" id="wax-seal" aria-label="Open the letter">
          <span class="seal-text">ICONE</span>
        </button>
      </div>
    </div>
    <p class="tap-hint">✨ Tap the Golden Seal ✨</p>
  </section>

  <!-- 4. LOVE LETTER -->
  <section class="screen" id="screen-letter">
    <div class="letter-card">
      <div class="letter-card-inner">
        <p class="letter-text" id="letter-text"></p>
        <span class="typing-cursor" id="typing-cursor">|</span>
      </div>
    </div>
    <button class="glow-btn hidden" id="btn-continue-story">
      <span>Continue Our Story</span> <span class="heart-icon">❤️</span>
    </button>
  </section>

  <!-- 5. SLIDESHOW -->
  <section class="screen" id="screen-slideshow">
    <div class="slideshow" id="slideshow"></div>
    <div class="slide-caption" id="slide-caption"></div>
    <div class="slide-progress" id="slide-progress"></div>
    <button class="skip-btn" id="btn-skip-slideshow">Skip to the end →</button>
  </section>

  <!-- 6. FINALE -->
  <section class="screen" id="screen-finale">
    <canvas id="fireworks"></canvas>
    <div class="finale-content">
      <div class="finale-line finale-eyebrow">✧ ✧ ✧</div>
      <h1 class="script-heading finale-title">Forever &amp; Always</h1>
      <h2 class="name-heading">Happy Girlfriend&rsquo;s Day</h2>
      <h2 class="name-heading finale-name">Mrs. Icone</h2>
      <p class="finale-signature">Love Always,<br><span>Icone</span></p>
    </div>
  </section>

</main>

<script src="script.js"></script>
</body>
</html>
